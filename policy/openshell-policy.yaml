# OpenShell 샌드박스 정책 (커널 레이어: Landlock 파일시스템 + OPA 바이너리/호스트 + L7 프록시, 샌드박스 syscall 제한)
# 사용: openshell sandbox create --name guardops --policy policy/openshell-policy.yaml ...
# 형식: NVIDIA OpenShell 공식 sandbox-policy-quickstart / generate-sandbox-policy 스킬 템플릿.
# 검증: scripts/audit_openshell_policy.py — 공식 스킬 'Step 6: Validate and Warn' 체크리스트 + 앱 계층과의 교차 검증.
#       앱 계층 egress_url_rules(policy/app_policy.yaml)와 같은 경로만 커널 계층에서도 허용한다(이중 방어 일치).
version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort

network_policies:
  # 추론: python3 만, NVIDIA API 의 두 경로만 (L7 검사 — 자격증명 provider 트래픽이므로 L4 통과 금지)
  nvidia-build-api:
    name: nvidia-build-api
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/v1/chat/completions"
          - allow:
              method: GET
              path: "/v1/models"
    binaries:
      - { path: /usr/bin/python3.12 }   # OpenShell 은 심볼릭 링크(/usr/bin/python3)가 아닌 실제 실행 파일로 식별
  # CVE 조회: python3 만, GET 으로 CVE 상세 경로만 (앱 계층 egress_url_rules 와 동일한 범위)
  cve-lookup:
    name: cve-lookup
    endpoints:
      - host: nvd.nist.gov
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/vuln/detail/*"
      - host: cve.mitre.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/cgi-bin/cvename.cgi"
    binaries:
      - { path: /usr/bin/python3.12 }   # OpenShell 은 심볼릭 링크(/usr/bin/python3)가 아닌 실제 실행 파일로 식별
# 그 외 모든 목적지(예: attacker.example)·모든 다른 바이너리(curl 등)는 기본 거부 → openshell logs 에 OCSF DENIED 로 기록
